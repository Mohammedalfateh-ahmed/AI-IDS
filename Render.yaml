services:
  - type: web
    name: ai-ids-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: ai_ids
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: DEBUG
        value: False
      - key: ALLOWED_ORIGINS
        fromService:
          type: web
          name: ai-ids-frontend
          property: host
      - key: SMTP_SERVER
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: ALERT_EMAIL_RECIPIENT
        sync: false

  - type: web
    name: ai-ids-frontend
    env: static
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ai-ids-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
